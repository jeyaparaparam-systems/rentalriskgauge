name: Daily data update

on:
  schedule:
    # Main run soon after the official closing numbers are posted, then two backup runs
    # (times in UTC; GitHub may start a run a few minutes late). A run saves nothing until
    # today's VIX close and 10-year Treasury yield are posted, and a backup run does nothing
    # if today's data is already saved. The last run saves whatever is available.
    - cron: "15 23 * * 1-5"  # about 3:15 PM PST / 4:15 PM PDT (main run)
    - cron: "30 0 * * 2-6"   # about 4:30 PM PST / 5:30 PM PDT (backup)
    - cron: "30 2 * * 2-6"   # about 6:30 PM PST / 7:30 PM PDT (last run)
    # Morning freshness check (about 7:10 AM PST, Tuesday–Saturday): opens an alert if
    # the previous evening's data is missing.
    - cron: "10 15 * * 2-6"
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the script
        run: python -m py_compile scripts/update.py

      - name: Download data and recalculate scores
        if: github.event.schedule != '10 15 * * 2-6'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          USE_LICENSED_DATA: ${{ vars.USE_LICENSED_DATA || '1' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
          FINAL: ${{ github.event.schedule == '30 2 * * 2-6' && '--final' || '' }}
        run: |
          pip install --quiet openpyxl
          if [ -z "$FRED_API_KEY" ]; then echo "::warning::FRED_API_KEY secret is not set; most data cannot be downloaded."; fi
          # One more full attempt after 3 minutes if the first one fails.
          python scripts/update.py $FORCE $FINAL || { echo "First attempt failed; retrying in 3 minutes."; sleep 180; python scripts/update.py $FORCE $FINAL; }

      - name: Save the new data
        if: github.event.schedule != '10 15 * * 2-6'
        run: |
          if git diff --quiet -- data; then
            echo "No changes to save."
            exit 0
          fi
          git config user.name "rentalriskgauge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Daily data update $(TZ=America/Los_Angeles date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase --quiet && git push && exit 0
            echo "Push failed, retrying in 15 seconds…"; sleep 15
          done
          exit 1

      - name: Check the saved data is current
        # Only the last evening run and the morning check need the data to be current.
        if: github.event.schedule == '30 2 * * 2-6' || github.event.schedule == '10 15 * * 2-6' || github.event_name == 'workflow_dispatch'
        run: python scripts/update.py --verify

      - name: Quarterly reminder for the hand-entered CoStar cap rate
        # Morning check only. Opens one issue (GitHub emails you) when data/manual.json is more than about
        # four months old, and closes it once the new figure is entered. Never fails the run.
        if: github.event.schedule == '10 15 * * 2-6' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Quarterly: enter the latest CoStar cap rate"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' || true)
          if python scripts/update.py --cap-age; then
            if [ -n "$existing" ]; then gh issue close "$existing" --comment "Cap rate updated. Thanks." || true; fi
          elif [ -z "$existing" ]; then
            gh issue create --title "$title" --body "The CoStar apartment cap rate in data/manual.json is more than four months old. When CoStar's new quarterly San Francisco Bay Area multifamily report is out, edit data/manual.json: set licensed.cap and licensed.signals.cap (iso = last day of the quarter, date such as Q4 2026, and a one-sentence detail). This issue closes itself after the next morning check." || true
          fi

      - name: Alert by opening a GitHub issue (GitHub emails you)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Daily data update failed"
          body="The daily update run failed on $(TZ=America/Los_Angeles date '+%a %b %-d, %Y at %-I:%M %p PT'). Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          The website keeps showing the last good data and says some indicators may be delayed. Later runs today will try again; this issue closes itself after the next successful update."
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi

      - name: Close the alert after a good run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --search "Daily data update failed in:title" --json number --jq '.[].number' || true); do
            gh issue close "$n" --comment "Fixed: data updated successfully on $(TZ=America/Los_Angeles date '+%b %-d, %Y')."
          done
